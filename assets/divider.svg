<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="40" viewBox="0 0 1000 40" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/><stop offset="0.5" stop-color="#7DD3C7"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<line x1="40" y1="20" x2="960" y2="20" stroke="url(#l)" stroke-width="1.5"/>
<g transform="translate(500 20) rotate(45)" filter="url(#g)"><rect x="-6" y="-6" width="12" height="12" fill="#050d0d" stroke="#7DD3C7" stroke-width="2"><animate attributeName="stroke" values="#7DD3C7;#F5F7FA;#7DD3C7" dur="2s" repeatCount="indefinite"/></rect></g>
<circle cy="20" r="3.5" fill="#F5F7FA" filter="url(#g)"><animate attributeName="cx" values="40;960" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" repeatCount="indefinite"/></circle>
<circle cy="20" r="3.5" fill="#F5F7FA" filter="url(#g)"><animate attributeName="cx" values="960;40" dur="4s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="2s" repeatCount="indefinite"/></circle>
</svg>